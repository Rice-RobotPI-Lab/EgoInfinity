[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "egoinfinity"
version = "0.1.0"
description = "Metric 3D hand-object tracking from a static exo-view RGB video"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "license.txt"}
authors = [{name = "Rice RobotPI Lab"}]
keywords = [
    "hand-object-interaction", "hand-tracking", "monocular-depth",
    "3d-vision", "robotics", "egocentric", "exo-view",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

# Core runtime dependencies — mirrors requirements.txt's pinned set
# (see requirements.txt for the source of truth; this list is here so
# `pip install -e .` works without an extra step).
dependencies = [
    "numpy",
    "opencv-python",
    "torch",
    "torchvision",
    "scipy",
    "Pillow",
    "pyyaml",
    # WiLoR (vendored under third_party/wilor/)
    "pytorch-lightning",
    "smplx==0.1.28",
    "yacs",
    "timm",
    "einops",
    "hydra-core",
    "omegaconf",
    "rich",
    "scikit-image",
    "pyrender",
    "trimesh",
    # YOLO hand detector
    "ultralytics==8.1.34",
    # Video I/O (retarget depth.mp4 export, Action100M streaming)
    "imageio-ffmpeg",
    # Visualization
    "viser>=0.2.0",
]

[project.optional-dependencies]
# Bigger dev/test suite
dev = ["ruff>=0.5", "pytest"]

[project.urls]
Homepage = "https://github.com/Rice-RobotPI-Lab/EgoInfinity"
Repository = "https://github.com/Rice-RobotPI-Lab/EgoInfinity"

# ── Packaging: only the importable Python package, none of the data sub-trees ──
[tool.setuptools.packages.find]
include = ["egoinfinity*"]
exclude = [
    "third_party*",
    "retarget*",
    "exo_browser*",
    "scripts*",
    "tests*",
    "configs*",
    "docs*",
]

[tool.setuptools.package-data]
"egoinfinity" = ["py.typed"]

# ── Lint config (Phase 5 CI uses this) ────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py310"
# `private/` is internal-only (excluded at release tag time) but kept on `main`
# for daily dev — lint it like everything else. `third_party/` is vendored
# (WiLoR, SAM2 forks) so we don't enforce style there.
extend-exclude = ["third_party", "retarget/runs"]

[tool.ruff.lint]
# Pragmatic defaults — ignore noisy rules during the first pass.
select = ["E", "F", "W", "I"]
ignore = [
    "E501",  # line-too-long (we have many that go over 100; covered by formatter)
    "E402",  # module-import-not-at-top (pipeline does sys.path.insert before imports)
    "E731",  # lambda-assignment
    "E741",  # ambiguous variable name (we use `l`, `I` in math contexts)
]

[tool.ruff.lint.isort]
# Top-level packages / dirs we treat as first-party for import sorting.
# `tools` covers tools.rerun.refresh_*, tools.batch_pipeline, etc.
# `private` is internal-only (excluded at release-tag time).
known-first-party = [
    "egoinfinity",
    "scripts",
    "tools",
    "action100m_filter",
    "private",
]
