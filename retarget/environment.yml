name: egoinfinity

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.10
  - pip

  - pip:
    # simulation — CPU
    - mujoco==3.6.0

    # simulation — GPU/JAX (JaxVecEnv via MJX)
    - mujoco-mjx==3.6.0
    - jax[cuda12]==0.6.2

    # IK
    - pytorch-kinematics==0.9.1   # GPU-accelerated batch FK/IK, loads MJCF directly
    - pink==0.8.1                 # qpsolvers-based IK for pinocchio

    # numerics
    - numpy==2.2.6
    - scipy==1.15.3

    # deep learning — CUDA 12.1
    - torch==2.4.1
    - torchvision==0.19.1

    # transforms / rotation utils
    - roma==1.5.6                 # differentiable SO(3)/SE(3) utilities

    # geometry / mesh
    - trimesh==4.11.5

    # data loading / visualization
    - opencv-python-headless==4.13.0.92
    - matplotlib==3.10.8
    - pillow==12.2.0

    # training
    - tqdm==4.67.3
    - tensorboard==2.20.0
    - setuptools==69.5.1
